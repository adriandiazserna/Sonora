name: Compilación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        run: dotnet build Sonora.csproj -c Release -warnaserror
      - name: Revisar paquetes con vulnerabilidades conocidas
        run: dotnet list Sonora.csproj package --vulnerable --include-transitive
