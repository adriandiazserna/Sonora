name: Release

# Al subir una etiqueta como v1.0.0 se compila Sonora y se publica el Release con los .zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar (64 y 32 bits, completo y ligero)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          foreach ($rid in 'win-x64', 'win-x86') {
            dotnet publish Sonora.csproj -c Release -r $rid --self-contained true  -p:PublishReadyToRun=true -p:Version=$v -o "out/$rid/full/Sonora"
            dotnet publish Sonora.csproj -c Release -r $rid --self-contained false -p:PublishReadyToRun=true -p:Version=$v -o "out/$rid/lite/Sonora"
            Compress-Archive -Path "out/$rid/full/Sonora" -DestinationPath "Sonora-$v-$rid.zip"
            Compress-Archive -Path "out/$rid/lite/Sonora" -DestinationPath "Sonora-$v-$rid-ligero.zip"
          }
          Get-ChildItem *.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Instalador (Setup.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content Sonora.csproj) -replace '<Version>.*</Version>', "<Version>$v</Version>" | Set-Content Sonora.csproj
          foreach ($a in 'x64', 'x86') { ./tools/make-installer.ps1 -Arch $a }
          Copy-Item installer/out/*-Setup.exe .
          Get-ChildItem *.zip, *-Setup.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sonora ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            Sonora-*.zip
            Sonora-*-Setup.exe
            SHA256SUMS.txt
