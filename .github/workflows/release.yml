name: Release

# Al subir una etiqueta como v1.0.0 se compila Sonora y se publica el Release con los .zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar (completo y ligero)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish Sonora.csproj -c Release -r win-x64 --self-contained true  -p:PublishReadyToRun=true -p:Version=$v -o out/full/Sonora
          dotnet publish Sonora.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:Version=$v -o out/lite/Sonora
          Compress-Archive -Path out/full/Sonora -DestinationPath "Sonora-$v-win-x64.zip"
          Compress-Archive -Path out/lite/Sonora -DestinationPath "Sonora-$v-win-x64-ligero.zip"
          Get-ChildItem *.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sonora ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            Sonora-*.zip
            SHA256SUMS.txt
